<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Generar Íconos — PRODE 2026</title></head>
<body>
<p>Generando íconos PWA… Los archivos se descargarán automáticamente.</p>
<p>Mové los archivos descargados a la carpeta <code>icons/</code> del proyecto.</p>
<canvas id="c" style="display:none"></canvas>
<script>
function makeIcon(size) {
  const c = document.getElementById('c');
  c.width = c.height = size;
  const ctx = c.getContext('2d');

  // Background
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#003087');
  g.addColorStop(1, '#004aad');
  ctx.fillStyle = g;
  roundRect(ctx, 0, 0, size, size, size * 0.18);
  ctx.fill();

  // Cyan accent arc
  ctx.strokeStyle = '#00B4D8';
  ctx.lineWidth = size * 0.06;
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, size * 0.32, Math.PI * 1.1, Math.PI * 1.9);
  ctx.stroke();

  // "⚽" or "A" letter
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${Math.round(size * 0.42)}px -apple-system,sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('A', size / 2, size / 2 - size * 0.02);

  // Bottom label
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.font = `bold ${Math.round(size * 0.1)}px sans-serif`;
  ctx.fillText('PRODE 2026', size / 2, size * 0.82);

  return c.toDataURL('image/png');
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function download(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

window.onload = () => {
  [192, 512].forEach(size => {
    setTimeout(() => download(makeIcon(size), `icon-${size}.png`), size === 192 ? 500 : 1000);
  });
  document.querySelector('p').textContent = '✅ Íconos generados. Revisá tus descargas.';
};
</script>
</body>
</html>
